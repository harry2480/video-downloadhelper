name: Verify

on:
  # スタックPR（ベースが main 以外）でも必ず検証する。
  # branches を main に絞ると、フィーチャーブランチ宛のPRが素通りする。
  pull_request:
  push:
    branches: [main]

# GITHUB_TOKEN の既定スコープはリポジトリ設定でいつでも変わり、
# その変更は差分レビューに現れない。ここで最小権限に固定する
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm verify
