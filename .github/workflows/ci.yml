name: CI

# 拡張機能の Integration / E2E テスト。
# 実 Chrome の起動を伴い時間がかかるため verify.yml とは分離している。
on:
  push:
    branches: [main]
    paths:
      - 'apps/extension/**'
      - '.github/workflows/ci.yml'
  pull_request:
    paths:
      - 'apps/extension/**'
      - '.github/workflows/ci.yml'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  browser-tests:
    name: Integration / E2E テスト
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: コードをチェックアウト
        uses: actions/checkout@v4

      - name: pnpm をセットアップ
        uses: pnpm/action-setup@v6

      - name: Node.js をセットアップ（pnpm キャッシュ付き）
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: 依存関係をインストール
        run: pnpm install --frozen-lockfile

      - name: Playwright ブラウザをインストール
        run: pnpm --filter extension exec playwright install --with-deps chromium

      # 拡張機能のロードにはビルド済みの dist/ が必要
      - name: 拡張機能をビルド
        run: pnpm build

      - name: Integration テスト
        run: pnpm test:integration
        env:
          CI: true

      - name: E2E テスト
        run: pnpm test:e2e
        env:
          CI: true

      - name: Playwright レポートをアップロード（失敗時）
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/extension/playwright-report/
          retention-days: 7

      # レビュアーが chrome://extensions へ手動ロードして確認するための成果物
      - name: ビルド成果物をアップロード
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extension-dist
          path: apps/extension/dist/
          retention-days: 7
