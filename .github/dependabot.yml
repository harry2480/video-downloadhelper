# Dependabot 設定（テンプレート）
# 依存関係の自動更新 PR を作成する。
# 詳細: https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
version: 2
updates:
  # npm (pnpm workspace) — ルートで monorepo 全体の依存を解決
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
    commit-message:
      prefix: "chore(deps)"
      prefix-development: "chore(deps-dev)"
    groups:
      # マイナー・パッチはまとめて 1 PR にする
      minor-and-patch:
        update-types:
          - "minor"
          - "patch"

  # GitHub Actions
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "Asia/Tokyo"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(ci)"
    groups:
      # アクションの更新は ci / coverage / verify の 3 ファイルを同時に触るため、
      # 1 アクション 1 PR にすると必ず相互にコンフリクトする。まとめて 1 PR にする
      github-actions:
        patterns:
          - "*"
