# Codecov 設定
# 詳細: https://docs.codecov.com/docs/codecov-yaml
codecov:
  branch: main

coverage:
  status:
    # プロジェクト全体のカバレッジ
    project:
      default:
        target: auto        # 直近のベースより下がらなければ OK
        threshold: 1%       # 1% までの低下は許容
    # この PR/コミットで変更された行のカバレッジ
    patch:
      default:
        target: 80%
        threshold: 0%

# 計測対象は「Unit テストで検証する層」に限定する。
# 実行コンテキスト層（background/ offscreen/ content/ popup/）と
# shared/storage/（chrome.storage を直接呼ぶ Repository）は
# Integration / E2E で担保するため、Unit のカバレッジ計測から外す。
ignore:
  - "**/*.test.ts"
  - "**/*.test.tsx"
  - "**/*.d.ts"
  - "apps/extension/test/**"
  - "apps/extension/*.config.*"
  - "apps/extension/src/background/**"
  - "apps/extension/src/offscreen/**"
  - "apps/extension/src/content/**"
  - "apps/extension/src/popup/**"
  - "apps/extension/src/shared/storage/**"

# PR にカバレッジコメントを投稿
comment:
  layout: "reach, diff, flags, files"
  behavior: default
  require_changes: false
