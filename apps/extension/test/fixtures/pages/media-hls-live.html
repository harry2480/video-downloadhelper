<!doctype html>
<html lang="ja">
	<head>
		<meta charset="UTF-8" />
		<title>HLS マニフェストを繰り返し読み込むページ</title>
	</head>
	<body>
		<h1>ライブ HLS 相当の再読み込み</h1>
		<p>
			同じ Master Playlist を、シーケンス番号だけ変えて繰り返し取得する。
			ライブ HLS のプレイヤーが行う挙動を最小限で再現したもので、
			これらの URL は拡張機能の重複判定では 1 件へまとまる。
		</p>
		<script>
			// 抑止が効いていなければ、拡張機能はこの回数だけ再フェッチする
			let sequence = 0;
			const timer = setInterval(() => {
				sequence += 1;
				const request = new XMLHttpRequest();
				request.open('GET', `hls/master.m3u8?_HLS_msn=${sequence}`);
				request.send();
				if (sequence >= 8) clearInterval(timer);
			}, 120);
		</script>
	</body>
</html>
